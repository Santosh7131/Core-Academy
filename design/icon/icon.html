<!doctype html>
<!--
  Core Academy launcher icon: a "C" around a solid core, in the primary-action colours
  (actionFill #0E0E11, actionInk #FAFAFB). No accent: violet belongs to the AI paper reader.
  Rendered by tools/make-icon.ps1:  ?layer=foreground  adaptive-icon foreground (108-unit canvas,
  mark inside the 66-unit safe circle);  ?layer=legacy  the rounded-square icon for old Androids;
  ?layer=preview  a review sheet.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; }
  body.preview { background: #FAFAFB; font: 500 22px/1.3 system-ui, sans-serif; color: #3A3A42; padding: 48px; }
  .row { display: flex; gap: 48px; align-items: center; margin-bottom: 40px; }
  .cap { margin-top: 12px; text-align: center; }
  .mask-circle { border-radius: 50%; overflow: hidden; }
  .mask-squircle { border-radius: 30%; overflow: hidden; }
  .dark { background: #0C0C0F; padding: 32px; border-radius: 24px; }
</style>
</head>
<body>
<script>
  const layer = new URLSearchParams(location.search).get('layer') || 'preview';
  const INK = '#0E0E11', PAPER = '#FAFAFB';
  // The mark on a 108-unit canvas, nudged right because the open side of the C reads lighter.
  const mark = (color, scale = 1) => `
    <g transform="translate(55.5 54) scale(${scale}) translate(-54 -54)">
      <path d="M 70.85 39.86 A 22 22 0 1 0 70.85 68.14" fill="none" stroke="${color}" stroke-width="8.5" stroke-linecap="round"/>
      <circle cx="54" cy="54" r="6.5" fill="${color}"/>
    </g>`;
  const svg = (size, inner) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="${size}" height="${size}">${inner}</svg>`;
  const full = (size) => svg(size, `<rect width="108" height="108" fill="${INK}"/>${mark(PAPER)}`);

  if (layer === 'foreground') {
    document.body.innerHTML = svg(1024, mark(PAPER));
  } else if (layer === 'legacy') {
    document.body.innerHTML = svg(1024, `<rect x="4" y="4" width="100" height="100" rx="24" fill="${INK}"/>${mark(PAPER, 1.3)}`);
  } else {
    document.body.className = 'preview';
    document.body.innerHTML = `
      <div class="row">
        <div><div class="mask-circle">${full(360)}</div><div class="cap">Circle mask</div></div>
        <div><div class="mask-squircle">${full(360)}</div><div class="cap">Squircle mask</div></div>
        <div>${svg(360, `<rect x="4" y="4" width="100" height="100" rx="24" fill="${INK}"/>${mark(PAPER, 1.3)}`)}<div class="cap">Older Android</div></div>
      </div>
      <div class="row">
        ${[192, 144, 96, 72, 48].map((s) => `<div><div class="mask-circle">${full(s)}</div><div class="cap">${s}px</div></div>`).join('')}
        <div class="dark"><div class="mask-circle">${full(144)}</div><div class="cap" style="color:#90909C">On a dark home screen</div></div>
        <div><div class="mask-circle">${svg(144, `<rect width="108" height="108" fill="#E8E2F4"/>${mark('#3B3355')}`)}</div><div class="cap">Themed icon</div></div>
      </div>`;
  }
</script>
</body>
</html>
