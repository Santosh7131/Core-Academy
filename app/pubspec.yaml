name: core_academy
description: "Core Academy: MCQ tests for a maths tuition, with teacher-managed logins."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.13.2

dependencies:
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  pdfx: ^2.11.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Geist
      fonts: [{asset: assets/fonts/Geist.ttf}]
    - family: GeistMono
      fonts: [{asset: assets/fonts/GeistMono.ttf}]
    # Phosphor Light icons (MIT); see lib/ui/icons.dart
    - family: PhosphorLight
      fonts: [{asset: assets/fonts/PhosphorLight.ttf}]
